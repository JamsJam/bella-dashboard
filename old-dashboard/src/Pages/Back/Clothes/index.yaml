page:
  - type: adminTabsBlock
    reverse: false
    tabs:
      - label: "vêtements"
        href: "app_clothes"
        isActive: true
      - label: "categories"
        href: "app_home"
        isActive: false
      - label: "Collections"
        href: "app_home"
        isActive: false
  - type: adminTabsBlock
    reverse: true
    tabs:
      - label: "Ajouter"
        href: "app_clothes"
        isActive: false
      - label: "Retour"
        href: "app_home"
        isActive: false
  - type: adminSortableTableBlock
    # ==== rows configuration
    reverse: false
    # ==== Table configuration
    tableTitle: Liste des vetements
    noItemsLabel: "aucun élément trouvé"
    isPaginated: true
    isSearchable: false	
    isSortable: true						
    limit: 10		# int → nombre total de pages
    # ==== Data Provider configuration
    service: ClotheService
    methode: getDistinctClothe
    params:
      - sortBy
      - direction
    # ==== header column configuratoin
    colTitles: 									# array → titres colonnes
      - label: Image
        property: image
        dataType: image
        isSortable: false
      - label: Nom
        property: name
        dataType: text
        isSortable: true
      - label: Collection
        property: collection
        dataType: text
        isSortable: true
      - label: Categorie
        property: category
        dataType: text
        isSortable: true
      - label: Status
        property: isOnline
        dataType: boolean
        isTrue: En ligne
        isFalse: Hors ligne
        isSortable:  false
      - label: Action
        dataType: action
        options: 
          - type: link
            label : Modifier
            route: app_clothes
            param: slug
          - type: link
            label : Ajouter au Carousel
            route: app_clothes
            param: slug
          - type: link
            label : Ajouter au Bestsellers
            route: app_clothes
            param: slug
          - type: form
            label : Supprimer
            route: app_clothes
            param: slug
        property: ''
        isSortable: false
    # ==== pagination configuration
    currentPage: 1
    # ==== sort configuration
    defaultSort: "nom"
    defaultDirection: "asc"
    nextDirection: "desc"
  
  - type: adminSortableTableBlock
    tableTitle: Bestsellers
    noItemsLabel: "aucun élément trouvé"
    reverse: false
    isPaginated: false
    isSearchable: false
    isSortable: false	
    limit: 2						# int → nombre total de pages
    colTitles: 									# array → titres colonnes
      - label: Image
        property: image
        dataType: image
        isSortable: false
      - label: Nom
        property: name
        dataType: text
        isSortable: false
      - label: Collection
        property: collection
        dataType: text
        isSortable: false
      - label: Categorie
        property: category
        dataType: text
        isSortable: false

      - label: Action
        dataType: action
        options: 
          - type: link
            label : Modifier
            route: app_clothes
            param: slug
          - type: form
            label : Supprimer
            route: app_clothes
            param: slug
        property: ''
        isSortable: false
    service: ClotheService
    methode: getBestselledClothe
  
  - type: adminSortableTableBlock
    tableTitle: Carousel
    noItemsLabel: "aucun élément trouvé"
    reverse: false
    isPaginated: false
    isSearchable: false
    isSortable: false	
    limit: 5						
    colTitles: 									
      - label: Image
        property: image
        dataType: image
        isSortable: false
      - label: Nom
        property: name
        dataType: text
        isSortable: false
      - label: Collection
        property: collection
        dataType: text
        isSortable: false
      - label: Categorie
        property: category
        dataType: text
        isSortable: false

      - label: Action
        dataType: action
        options: 
          - type: link
            label : Modifier
            route: app_clothes
            param: slug
          - type: form
            label : Supprimer
            route: app_clothes
            param: slug
        property: ''
        isSortable: false
    service: ClotheService
    methode: getClotheInCarousel
    currentSort: "nom"								
    currentDirection: "asc"		 				
    nextDirection: "desc"
  
title: Les Vêtements

