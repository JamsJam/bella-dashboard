name: deploydevelop

on:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  deploy:
    name: Deployer l'environnement de test
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v6
      
      # - name: Générer un sous-domaine temporaire
      #   id: hash
      #   run: |
      #     set -e
      #     HASH=$(head /dev/urandom | tr -dc a-z0-9 | head -c 10)
      #     echo "hash=$HASH" >> "$GITHUB_OUTPUT"```yaml
      - name: Deployer sur le serveur de test
        uses: appleboy/ssh-action@v1.2.5

        env:
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
          JWT_PASSPHRASE_SOURCE: ${{ secrets.JWT_PASSPHRASE }}
          JWT_SECRET_KEY_SOURCE: ${{ secrets.JWT_SECRET_KEY }}
          JWT_PUBLIC_KEY_SOURCE: ${{ secrets.JWT_PUBLIC_KEY }}
          APP_SECRET_SOURCE: ${{ secrets.APP_TEST_SECRET }}
          DATABASE_URL_SOURCE: ${{ secrets.DATABASE_TEST_URL }}
          MESSENGER_TRANSPORT_DSN_SOURCE: ${{ secrets.MESSENGER_TEST_TRANSPORT_DSN }}
          CORS_ALLOW_ORIGIN_SOURCE: ${{ secrets.CORS_ALLOW_ORIGIN_TEST }}
          STRIPE_SECRET_KEY_SOURCE: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET_SOURCE: ${{ secrets.STRIPE_TEST_WEBHOOK_SECRET }}
          FRONT_APP_URL_SOURCE: ${{ secrets.FRONT_TEST_APP_URL }}
          MAILER_TRANSPORT_SOURCE: ${{ secrets.MAILER_TEST_TRANSPORT }}
          MAILER_USERNAME_SOURCE: ${{ secrets.MAILER_TEST_USERNAME }}
          MAILER_PASSWORD_SOURCE: ${{ secrets.MAILER_TEST_PASSWORD }}
          MAILER_HOST_SOURCE: ${{ secrets.MAILER_TEST_HOST }}
          MAILER_PORT_SOURCE: ${{ secrets.MAILER_TEST_PORT }}
          MAILER_ENCRYPTION_SOURCE: ${{ secrets.MAILER_TEST_ENCRYPTION }}


        with:
          host: ${{ secrets.APP_SERVER }}
          username: ${{ secrets.APP_USER }}
          password: ${{ secrets.APP_PASS }}
          port: ${{ secrets.APP_PORT }}
          envs: >-
            APP_DOMAIN,
            APP_SECRET_SOURCE,
            DATABASE_URL_SOURCE,
            MESSENGER_TRANSPORT_DSN_SOURCE,
            CORS_ALLOW_ORIGIN_SOURCE,
            STRIPE_SECRET_KEY_SOURCE,
            STRIPE_WEBHOOK_SECRET_SOURCE,
            FRONT_APP_URL_SOURCE,
            MAILER_TRANSPORT_SOURCE,
            MAILER_USERNAME_SOURCE,
            MAILER_PASSWORD_SOURCE,
            MAILER_HOST_SOURCE,
            MAILER_PORT_SOURCE,
            MAILER_ENCRYPTION_SOURCE
            JWT_SECRET_KEY_SOURCE,
            JWT_PUBLIC_KEY_SOURCE,
            JWT_PASSPHRASE_SOURCE

          script: |
            set -Eeuo pipefail

            PROJECT_DIR="/var/www/${{ secrets.APP_USER }}/test-${{ secrets.APP_DOMAIN }}"

            echo "[1/11] Verification des variables requises"

            REQUIRED_VARIABLES=(
              APP_DOMAIN
              APP_SECRET_SOURCE
              DATABASE_URL_SOURCE

              MESSENGER_TRANSPORT_DSN_SOURCE
              CORS_ALLOW_ORIGIN_SOURCE

              STRIPE_SECRET_KEY_SOURCE
              STRIPE_WEBHOOK_SECRET_SOURCE

              FRONT_APP_URL_SOURCE

              MAILER_TRANSPORT_SOURCE
              MAILER_USERNAME_SOURCE
              MAILER_PASSWORD_SOURCE
              MAILER_HOST_SOURCE
              MAILER_PORT_SOURCE
              MAILER_ENCRYPTION_SOURCE

              JWT_SECRET_KEY_SOURCE
              JWT_PUBLIC_KEY_SOURCE
              JWT_PASSPHRASE_SOURCE
            )

            INDEX=0
            for VARIABLE_NAME in "${REQUIRED_VARIABLES[@]}"; do
              INDEX=$((INDEX + 1))
              if [ -z "${!VARIABLE_NAME:-}" ]; then
                echo "Erreur : la variable ${VARIABLE_NAME} est absente ou vide." >&2
                exit 1
              else
                echo "Variable ${VARIABLE_NAME} : OK"
                echo "${INDEX} sur ${#REQUIRED_VARIABLES[@]} variables verifiees"
              fi
            done

            echo "[2/11] Acces au dossier du projet"

            if [ ! -d "$PROJECT_DIR" ]; then
              echo "Erreur : le dossier ${PROJECT_DIR} n'existe pas." >&2
              exit 1
            fi

            cd "$PROJECT_DIR"
            pwd

            echo "[3/11] Recuperation du dernier code de develop"

            git checkout develop
            git pull --ff-only origin develop

            ```bash
            echo "[4/11] Mise a jour de la configuration de test"

            dotenv_quote() {
            php -r '
            echo json_encode(
              $argv[1],
              JSON_UNESCAPED_SLASHES | JSON_UNESCAPED_UNICODE
            );
            ' "$1"
            }

            DEFAULT_URI_VALUE="$(dotenv_quote "https://test-${APP_DOMAIN}")"
            DATABASE_URL_VALUE="$(dotenv_quote "$DATABASE_URL_SOURCE")"
            APP_SECRET_VALUE="$(dotenv_quote "$APP_SECRET_SOURCE")"

            MAILER_TRANSPORT_VALUE="$(dotenv_quote "$MAILER_TRANSPORT_SOURCE")"
            MAILER_USERNAME_VALUE="$(dotenv_quote "$MAILER_USERNAME_SOURCE")"
            MAILER_PASSWORD_VALUE="$(dotenv_quote "$MAILER_PASSWORD_SOURCE")"
            MAILER_HOST_VALUE="$(dotenv_quote "$MAILER_HOST_SOURCE")"
            MAILER_PORT_VALUE="$(dotenv_quote "$MAILER_PORT_SOURCE")"
            MAILER_ENCRYPTION_VALUE="$(dotenv_quote "$MAILER_ENCRYPTION_SOURCE")"

            MESSENGER_TRANSPORT_DSN_VALUE="$(dotenv_quote "$MESSENGER_TRANSPORT_DSN_SOURCE")"
            CORS_ALLOW_ORIGIN_VALUE="$(dotenv_quote "$CORS_ALLOW_ORIGIN_SOURCE")"

            JWT_SECRET_KEY_VALUE="$(dotenv_quote "$JWT_SECRET_KEY_SOURCE")"
            JWT_PUBLIC_KEY_VALUE="$(dotenv_quote "$JWT_PUBLIC_KEY_SOURCE")"
            JWT_PASSPHRASE_VALUE="$(dotenv_quote "$JWT_PASSPHRASE_SOURCE")"

            STRIPE_SECRET_KEY_VALUE="$(dotenv_quote "$STRIPE_SECRET_KEY_SOURCE")"
            STRIPE_WEBHOOK_SECRET_VALUE="$(dotenv_quote "$STRIPE_WEBHOOK_SECRET_SOURCE")"

            FRONT_APP_URL_VALUE="$(dotenv_quote "$FRONT_APP_URL_SOURCE")"

            cat > .env.local <<EOF
            APP_ENV=prod
            APP_DEBUG=0

            # Configuration de l'application
            DEFAULT_URI=${DEFAULT_URI_VALUE}
            DATABASE_URL=${DATABASE_URL_VALUE}
            APP_SECRET=${APP_SECRET_VALUE}

            # Configuration du mailer
            MAILER_TRANSPORT=${MAILER_TRANSPORT_VALUE}
            MAILER_USERNAME=${MAILER_USERNAME_VALUE}
            MAILER_PASSWORD=${MAILER_PASSWORD_VALUE}
            MAILER_HOST=${MAILER_HOST_VALUE}
            MAILER_PORT=${MAILER_PORT_VALUE}
            MAILER_ENCRYPTION=${MAILER_ENCRYPTION_VALUE}

            # Configuration Messenger
            MESSENGER_TRANSPORT_DSN=${MESSENGER_TRANSPORT_DSN_VALUE}

            # Configuration CORS
            CORS_ALLOW_ORIGIN=${CORS_ALLOW_ORIGIN_VALUE}

            # Configuration JWT
            JWT_SECRET_KEY=${JWT_SECRET_KEY_VALUE}
            JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY_VALUE}
            JWT_PASSPHRASE=${JWT_PASSPHRASE_VALUE}

            # Configuration Stripe
            STRIPE_SECRET_KEY_PROD=${STRIPE_SECRET_KEY_VALUE}
            STRIPE_WEBHOOK_SECRET_PROD=${STRIPE_WEBHOOK_SECRET_VALUE}

            # Configuration du front-end
            FRONT_APP_URL=${FRONT_APP_URL_VALUE}
            EOF


            chmod 600 .env.local

            echo "[5/11] Validation de la configuration Composer"

            composer validate --no-check-publish

            echo "[6/11] Installation des dependances Composer"

            composer install \
              --no-dev \
              --optimize-autoloader \
              --no-interaction


            echo "[7/11] Optimisation des variables d'environnement Symfony"

            composer dump-env prod

            echo "[8/11] Nettoyage du cache et execution des migrations"

            APP_ENV=prod APP_DEBUG=0 php bin/console cache:clear --no-warmup
            APP_ENV=prod APP_DEBUG=0 php bin/console doctrine:migrations:migrate --no-interaction

            echo "[9/11] Compilation des assets Sass et AssetMapper"

            APP_ENV=prod APP_DEBUG=0 php bin/console sass:build
            APP_ENV=prod APP_DEBUG=0 php bin/console asset-map:compile

            echo "[10/11] Rechauffement du cache Symfony"

            APP_ENV=prod APP_DEBUG=0 php bin/console cache:warmup
            
            echo "[11/11] Redemarrage des workers Messenger"
            
            APP_ENV=prod APP_DEBUG=0 php bin/console messenger:stop-workers
            supervisorctl restart messenger-consume:*

            echo "Deploiement sur le serveur de test termine avec succes."

